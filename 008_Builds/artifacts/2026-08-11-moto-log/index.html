<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moto Log</title>
    <meta name="description" content="Motorcycle service intervals, renewal dates and running costs." />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />

    <!-- iOS has no manifest support: these are what give it a home-screen icon
         and a chromeless window when launched from there. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Moto Log" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tints the Android status bar to match the odometer housing. -->
    <meta name="theme-color" content="#15181B" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
