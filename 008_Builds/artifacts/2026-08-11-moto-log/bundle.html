cored disc"],checks:["Look at pad thickness through the caliper","A light squeal after rain that goes away is normal","Grinding means stop using that brake and replace the pads now","A pulsing lever points at the disc"]},{id:"wobble",title:"Wobble, weave or vague steering",ride:"stop",causes:["Low tyre pressure or a slow puncture","Worn or squared-off tyre","Loose or worn steering head bearings","Loose axle or wheel bearing","Unbalanced wheel after a tyre change"],checks:["Check both pressures first — it is the cause most of the time","Look over the whole tread for a nail","Front wheel off the ground: bars should swing freely with no notch at centre","Grab each wheel and rock it sideways; any play is a bearing"]},{id:"hot",title:"Running hot or coolant light",ride:"stop",causes:["Low coolant","Radiator fan not cutting in","Radiator fins blocked with dirt","Stuck thermostat or failing water pump","Low engine oil on air-cooled bikes"],checks:["Stop and let it cool. Never open a hot radiator cap","Check the expansion tank level once cool","Does the fan run when it gets hot in traffic? If not, check its fuse","Look for coolant weeping from hoses or the water pump"]},{id:"oil",title:"Oil light on while riding",ride:"stop",causes:["Low oil level","Failed oil pressure switch","Oil pump or blocked strainer"],checks:["Pull over and switch off straight away — running without pressure destroys the engine","Check the level on the sight glass or dipstick with the bike upright","Top up if low. If the level is fine and the light stays on, have it recovered"]},{id:"clutch",title:"Revs rise but the bike doesn't pull",ride:"careful",causes:["Clutch slipping from worn plates","No free play in the clutch cable","Wrong oil (car oil with friction modifiers)","Worn drive belt or rollers on a scooter"],checks:["Check for 10–20 mm of free play at the lever","Worst in high gears at full throttle? That is clutch slip","Was the oil changed recently? It must be motorcycle oil rated JASO MA or M
